version: 2
# Every update waits 7 days after its upstream release before Dependabot
# proposes it, so a compromised or broken release is usually caught upstream
# first. Security updates are exempt and still open immediately. Our own
# nos-tromo/* workflows skip the wait, so a hub release is not held back.
# Dependabot can only date Docker Hub images, and the Open WebUI image lives
# on ghcr.io, so its updates arrive without the wait. Open WebUI does not sign
# its images either, so the shared CI's provenance check cannot vouch for them:
# check the upstream release before merging.
updates:
  # Pinned upstream Open WebUI image in docker/compose.yaml
  # (ghcr.io/open-webui/open-webui:<tag>@sha256:<digest>) — the main update this
  # wrapper cares about. The docker-compose ecosystem reads compose `image:`
  # keys and opens one PR bumping tag and digest together on both services that
  # run the image. (The docker ecosystem reads only Dockerfiles, of which this
  # repo has none, so it failed every run.) data-plane omits this: its DB
  # images are pull-only and deliberately not auto-bumped; here the pinned
  # image is the whole point of the repo.
  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Reusable-workflow refs and any actions used under .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "nos-tromo/*"

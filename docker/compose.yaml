name: open-webui-service

services:
  ##########################################################
  # Volume ownership (deploy ADR 0001, self-healing)
  #
  # open-webui runs as uid 10001 (user: override below; the image
  # defaults to root), but the external volume keeps whatever ownership
  # it was created with — including the root-owned copy the image writes
  # into an empty volume on first mount. This one-shot root container
  # fixes ownership before the app starts; it reuses the same pinned
  # image (anchor) so the airgap bundle needs no extra image. The find
  # form only touches wrong-owner entries. Canonical shape:
  # docint/docker/compose.yaml.
  ##########################################################
  volume-permissions:
    image: &open-webui-image ghcr.io/open-webui/open-webui:0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    # Root is the mountpoint itself — its parent dirs live on the
    # read-only image rootfs and must not (and cannot) be chowned.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        find /app/backend/data
        -xdev ! -user 10001 -exec chown -h 10001:10001 {} +
    volumes:
      - open-webui-data:/app/backend/data
    restart: "no"

  open-webui:
    image: *open-webui-image
    # Container hardening (deploy ADR 0001). The image defaults to root;
    # run it as the federation's app uid instead. All durable writes land
    # on open-webui-data (ownership is self-healed by the volume-permissions
    # one-shot below on every up — including the root-owned re-copy a first
    # mount writes into an empty volume). read_only: the app's boot-time
    # copy of branding assets into its static dir fails non-fatally
    # (logged ERRORs, stock assets served from the image) — accepted.
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    container_name: open-webui
    environment:
      NO_PROXY: "backend,frontend,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
      no_proxy: "backend,frontend,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
      # Non-root + read_only support: the image's HOME=/root is unwritable
      # for uid 10001, and start.sh would otherwise generate its secret key
      # in the (read-only) working directory. Persisting the key on the
      # data volume also keeps sessions valid across container recreation.
      HOME: /tmp
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      # This app ships NO bundled inference provider. It reaches inference
      # ONLY over the OpenAI-compatible API below — exactly like the other
      # consumers (docint, chorus, Nextext, translator). The endpoint is
      # swappable by env: vllm-service's LiteLLM proxy (alias 'vllm-router'),
      # or any other OpenAI-compatible server (e.g. Ollama's /v1).
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://vllm-router:4000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-1234567890}
      # Default chat model auto-selected for new chats. Uses the stack-wide
      # TEXT_MODEL convention (the chat model id registered on the endpoint);
      # empty => Open WebUI falls back to auto-selecting the first model.
      DEFAULT_MODELS: ${TEXT_MODEL:-}
      # Hard-disable Open WebUI's built-in Ollama provider. Inference must go
      # through OPENAI_API_BASE_URL only — never a second, bundled backend.
      ENABLE_OLLAMA_API: false
      # Make .env the single source of truth: do not let admin-UI changes
      # persist to the DB and shadow these vars. Keeps the endpoint swappable
      # by editing .env + restart, matching the stack's env-driven config.
      ENABLE_PERSISTENT_CONFIG: false
      # 0.11.0 hides connection models that have no per-model access-control
      # entry from non-admin users (utils/models.py: "only admins can see
      # unconfigured models"). Every user here is a non-admin auto-created via
      # the trusted header, and access is already gated by Authelia at the
      # edge, so restore the pre-0.11 default: all users see all endpoint
      # models. Without this the model picker is empty for everyone but the
      # first (admin) user.
      BYPASS_MODEL_ACCESS_CONTROL: true
      # Embeddings run through the same OpenAI-compatible endpoint — NOT a local
      # model. The standard image otherwise loads sentence-transformers in-process
      # and pulls it from HuggingFace at boot; this removes that bundled provider.
      # RAG_EMBEDDING_MODEL follows the stack-wide EMBED_MODEL convention (the id
      # registered on the endpoint). NOTE the id differs per endpoint: Ollama
      # serves it as `bge-m3:latest`, vllm-service as `BAAI/bge-m3` — so EMBED_MODEL
      # must match the active OPENAI_API_BASE_URL (set it per provider, like the
      # other consumers). Fallback is the Ollama tag.
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: ${EMBED_MODEL:-bge-m3:latest}
      RAG_OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://vllm-router:4000/v1}
      RAG_OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-1234567890}
      # Speech-to-text via the endpoint, so no local Whisper is bundled. Open
      # WebUI does NOT inherit OPENAI_API_BASE_URL for STT — its built-in default
      # is the literal api.openai.com (config.py reassigns the var) — so the base
      # is wired explicitly, mirroring the stack's WHISPER_API_BASE convention
      # (Nextext): it defaults to OPENAI_API_BASE_URL, so production (vllm-router,
      # which fronts the asr backend) needs nothing extra. For the Ollama dev
      # endpoint (no STT), set WHISPER_API_BASE in .env to the CPU asr-only stack
      # (http://asr-only:8000/v1). AUDIO_STT_MODEL shares the stack's WHISPER_MODEL,
      # so it auto-matches whatever the asr endpoint serves.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: ${WHISPER_API_BASE:-${OPENAI_API_BASE_URL:-http://vllm-router:4000/v1}}
      AUDIO_STT_OPENAI_API_KEY: ${WHISPER_API_KEY:-${OPENAI_API_KEY:-sk-1234567890}}
      AUDIO_STT_MODEL: ${WHISPER_MODEL:-openai/whisper-large-v3}
      # Airgap: never fetch models/weights from HuggingFace at runtime, and
      # disable upstream update checks. With embeddings external, nothing local
      # needs downloading.
      OFFLINE_MODE: true
      HF_HUB_OFFLINE: 1
      # Single sign-on: trust the identity the edge gateway injects after
      # Authelia forward-auth. The gateway strips these headers from
      # clients, so they cannot be forged from outside edge-net.
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Auth-Email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Auth-User
      # First-ever user becomes admin (Open WebUI default); everyone after
      # would default to 'pending' and need admin approval — pointless
      # behind Authelia, which is the real gate. Auto-activate instead.
      DEFAULT_USER_ROLE: user
      # Cap the app's own JWT lifetime: Authelia's sign-out ends the
      # gateway session but cannot invalidate this token. Renewal is
      # silent via the trusted headers while the gateway session lives,
      # so a short TTL binds the app session to the gateway session with
      # at most this much lag — no visible re-login cost.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      # Signing out inside Open WebUI also ends the gateway session:
      # after clearing its own token the app redirects to Authelia's
      # logout endpoint.
      WEBUI_AUTH_SIGNOUT_REDIRECT_URL: ${WEBUI_AUTH_SIGNOUT_REDIRECT_URL:-https://${EDGE_HOST:-localhost}/auth/logout}
    env_file:
      - path: ../.env
        required: false
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    networks:
      inference-net:
        aliases:
          - open-webui-client
      edge-net:
        aliases:
          - open-webui

volumes:
  # External so app teardown (even `docker compose down -v`) can never delete
  # user data. Created out-of-band by `make volumes`; removed only by `make
  # nuke`. Keep the name in sync with the Makefile (OPEN_WEBUI_VOLUME).
  open-webui-data:
    external: true

networks:
  inference-net:
    external: true
    name: ${INFERENCE_NET:-inference-net}
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}
